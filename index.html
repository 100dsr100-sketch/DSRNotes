<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DSR Notes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>DSR Notes</title>
<script>/* 2a: own address dsr-notes.pages.dev - the old shared github.io copy shows an "OLD COPY - moved" page that can
   move this app's data across; see dsr-move.js */
window.DSR_MOVE = { name: "DSR Notes", to: "https://dsr-notes.pages.dev/", ls: ["dsr-notes-"], idb: ["dsr-notes"] };</script>
<script src="dsr-move.js?v=2"></script>
<style>
  :root{
    --bg:#0b0b0b; --bg2:#141414; --card:#171717; --line:#2a2a2a;
    --ink:#ece7d8; --dim:#8f8a7d; --gold:#d4af37; --gold2:#e8c86e;
    --danger:#c0563e;
    /* pale note washes — dark ink sits on top (see .card:not(.c-none) / .editor.tint) */
    --n-none:#171717; --n-red:#e8c4bd; --n-orange:#efd3b3; --n-gold:#ece0b0;
    --n-green:#cfe0bf; --n-teal:#bfdedb; --n-blue:#c6d8ec; --n-purple:#d8cbe6;
    --wash-ink:#2a2620; --wash-dim:#5f5a4e; --wash-done:#8a857a; --wash-line:rgba(0,0,0,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior-y:none;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,textarea{font:inherit;color:inherit}

  /* ---------- top bar ---------- */
  header{
    position:sticky;top:0;z-index:20;background:rgba(11,11,11,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
    display:flex;align-items:center;gap:8px;
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.5px;color:var(--gold2)}
  .brand svg{width:22px;height:22px;flex:0 0 auto}
  .search{
    flex:1;display:flex;align-items:center;gap:6px;background:var(--bg2);
    border:1px solid var(--line);border-radius:20px;padding:6px 12px;min-width:0;
  }
  .search input{flex:1;border:none;background:none;outline:none;min-width:0}
  .search input::placeholder{color:var(--dim)}
  .iconbtn{
    width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    color:var(--gold2);font-size:18px;flex:0 0 auto;
  }
  .iconbtn:active{background:var(--bg2)}

  /* ---------- board ---------- */
  main{padding:12px 10px 120px;max-width:1100px;margin:0 auto}
  .seclabel{
    font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);
    margin:6px 4px 8px;font-weight:700;
  }
  .grid{columns:2 160px;column-gap:10px}
  @media(min-width:520px){ .grid{columns:3 200px} }
  @media(min-width:820px){ .grid{columns:4 220px} }
  @media(min-width:1040px){ .grid{columns:5 200px} }

  .card{
    break-inside:avoid;display:block;width:100%;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px;margin:0 0 10px;position:relative;overflow:hidden;
  }
  .card.pinned{border-color:var(--gold)}
  /* pale-washed cards: flip to dark ink */
  .card:not(.c-none){border-color:var(--wash-line)}
  .card:not(.c-none) h3{color:var(--wash-ink)}
  .card:not(.c-none) .excerpt,
  .card:not(.c-none) .meta{color:var(--wash-dim)}
  .card:not(.c-none) .cklist li{color:var(--wash-ink)}
  .card:not(.c-none) .cklist li.done{color:var(--wash-done)}
  .card:not(.c-none) .cklist .bx{border-color:var(--wash-dim)}
  .card:not(.c-none) .voicechip{color:#7a5f12}
  .card:not(.c-none) .pin.on{color:#8a6d15}
  .card:not(.c-none) .cdot{border-color:rgba(0,0,0,.28)}
  .card h3{margin:0 0 6px;font-size:15px;font-weight:700;color:var(--ink);word-break:break-word}
  .card .excerpt{color:var(--dim);white-space:pre-wrap;word-break:break-word;font-size:13.5px;max-height:11.5em;overflow:hidden}
  .card .cklist{list-style:none;margin:2px 0 0;padding:0;font-size:13.5px}
  .card .cklist li{display:flex;gap:6px;align-items:flex-start;margin:3px 0;color:var(--ink)}
  .card .cklist li.done{color:var(--dim);text-decoration:line-through}
  .card .cklist .bx{flex:0 0 auto;width:14px;height:14px;border:1.5px solid var(--dim);border-radius:3px;margin-top:2px}
  .card .cklist li.done .bx{background:var(--gold);border-color:var(--gold)}
  .card .thumb{margin:-12px -12px 8px;display:block;width:calc(100% + 24px);background:#fff}
  .card .voicechip{display:flex;align-items:center;gap:8px;color:var(--gold2);font-weight:600}
  .card .pin{
    position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;
    display:grid;place-items:center;font-size:15px;opacity:.35;
  }
  .card .pin.on{opacity:1;color:var(--gold2)}
  .card .cdot{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.15);vertical-align:middle}
  .card .meta{margin-top:8px;font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px}
  .empty{color:var(--dim);text-align:center;padding:60px 20px}
  .empty svg{width:56px;height:56px;opacity:.4;display:block;margin:0 auto 12px}

  /* colour classes */
  .c-none{background:var(--n-none)} .c-red{background:var(--n-red)} .c-orange{background:var(--n-orange)}
  .c-gold{background:var(--n-gold)} .c-green{background:var(--n-green)} .c-teal{background:var(--n-teal)}
  .c-blue{background:var(--n-blue)} .c-purple{background:var(--n-purple)}

  /* ---------- FAB ---------- */
  .fabwrap{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .fab{
    width:58px;height:58px;border-radius:50%;background:var(--gold);color:#1a1400;
    font-size:30px;font-weight:700;display:grid;place-items:center;
    box-shadow:0 6px 20px rgba(0,0,0,.5);
  }
  .fab:active{transform:scale(.94)}
  .dial{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .dial button{
    display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:26px;padding:8px 14px 8px 12px;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.4);
    font-weight:600;
  }
  .dial button .em{font-size:18px}
  .dial[hidden]{display:none}

  /* ---------- editor ---------- */
  .editor{
    position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  }
  .editor[hidden]{display:none}
  .etop{
    display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 8px) 6px 8px;
    border-bottom:1px solid var(--line);
  }
  .etop .grow{flex:1}
  .ebody{flex:1;overflow:auto;padding:14px 16px calc(env(safe-area-inset-bottom) + 24px);max-width:760px;width:100%;margin:0 auto}
  .etitle{width:100%;border:none;background:none;outline:none;font-size:20px;font-weight:700;color:var(--ink);margin-bottom:10px}
  .etitle::placeholder{color:var(--dim)}
  .etext{width:100%;min-height:50vh;border:none;background:none;outline:none;resize:none;color:var(--ink);font-size:16px;line-height:1.55}
  .etext::placeholder{color:var(--dim)}

  /* open note carries its pale wash (Keep-style) */
  .editor.tint{background:var(--note-wash)}
  .editor.tint .etop{background:rgba(0,0,0,.05);border-bottom-color:rgba(0,0,0,.14)}
  .editor.tint .iconbtn{color:#3f3a2c}
  .editor.tint .iconbtn:active{background:rgba(0,0,0,.06)}
  .editor.tint .etitle,
  .editor.tint .etext,
  .editor.tint .ckrow input.txt,
  .editor.tint .ckadd input,
  .editor.tint .rectime,
  .editor.tint .transcript{color:var(--wash-ink)}
  .editor.tint .etitle::placeholder,
  .editor.tint .etext::placeholder,
  .editor.tint .ckadd input::placeholder{color:#6b6555}
  .editor.tint .ckrow{border-bottom-color:rgba(0,0,0,.16)}
  .editor.tint .ckrow.done input.txt{color:var(--wash-done)}
  .editor.tint .ckrow .bx{border-color:#7a7460}
  .editor.tint .ckrow .drag,
  .editor.tint .ckrow .rm,
  .editor.tint .ckrow .mv,
  .editor.tint .cktoggle,
  .editor.tint .rechint{color:var(--wash-dim)}
  .editor.tint .ckadd{color:#7a5f12}
  .editor.tint .transcript{background:rgba(255,255,255,.4);border-color:rgba(0,0,0,.18)}

  /* checklist editor */
  .ckedit{list-style:none;margin:0;padding:0}
  .ckrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .ckrow .bx{width:20px;height:20px;border:2px solid var(--dim);border-radius:5px;flex:0 0 auto;display:grid;place-items:center;color:#1a1400;font-size:13px}
  .ckrow.done .bx{background:var(--gold);border-color:var(--gold)}
  .ckrow input.txt{flex:1;border:none;background:none;outline:none;font-size:16px}
  .ckrow.done input.txt{color:var(--dim);text-decoration:line-through}
  .ckrow .mv,.ckrow .rm{width:30px;height:30px;border-radius:6px;color:var(--dim);font-size:15px;flex:0 0 auto}
  .ckrow .mv:active,.ckrow .rm:active{background:var(--bg2)}
  .ckadd{display:flex;align-items:center;gap:8px;padding:10px 0;color:var(--gold2)}
  .ckadd input{flex:1;border:none;background:none;outline:none;font-size:16px}
  .cktoggle{margin-top:14px;color:var(--dim);font-size:13px;display:flex;align-items:center;gap:8px}

  /* voice editor */
  .voicebox{text-align:center;padding:24px 0}
  .recbtn{width:96px;height:96px;border-radius:50%;background:var(--danger);color:#fff;font-size:34px;display:grid;place-items:center;margin:0 auto;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  .recbtn.recording{animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,86,62,.5)}50%{box-shadow:0 0 0 18px rgba(192,86,62,0)}}
  .rectime{font-size:30px;font-weight:700;letter-spacing:2px;margin:16px 0 4px;font-variant-numeric:tabular-nums}
  .rechint{color:var(--dim);font-size:13px}
  .player{margin-top:20px;display:flex;flex-direction:column;gap:10px;align-items:center}
  .player audio{width:100%}
  .transcript{margin-top:18px;width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);padding:10px;outline:none;color:var(--ink)}

  /* draw editor */
  .drawwrap{display:flex;flex-direction:column;height:100%}
  .canvashold{flex:1;overflow:auto;display:grid;place-items:center;background:#0f0f0f;padding:10px}
  #pad{background:#fff;border-radius:6px;touch-action:none;max-width:100%;height:auto;box-shadow:0 4px 18px rgba(0,0,0,.5)}
  .tools{display:flex;align-items:center;gap:8px;padding:10px;border-top:1px solid var(--line);overflow-x:auto}
  .swatch{width:26px;height:26px;border-radius:50%;border:2px solid #333;flex:0 0 auto}
  .swatch.sel{border-color:var(--gold2);transform:scale(1.12)}
  .tools .tbtn{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:var(--gold2);font-size:17px;flex:0 0 auto;border:1px solid var(--line)}
  .tools .tbtn.sel{background:var(--bg2);border-color:var(--gold)}
  .tools input[type=range]{width:100px;flex:0 0 auto;accent-color:var(--gold)}

  /* colour sheet & menus */
  .sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
  .sheet[hidden]{display:none}
  .sheet .panel{background:var(--bg2);border:1px solid var(--line);border-bottom:none;border-radius:16px 16px 0 0;width:100%;max-width:520px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px)}
  .sheet h4{margin:2px 0 12px;color:var(--gold2);font-size:13px;letter-spacing:1px;text-transform:uppercase}
  .colrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .colrow button{width:38px;height:38px;border-radius:50%;border:2px solid #333}
  .colrow button.sel{border-color:var(--gold2)}
  .menu{display:flex;flex-direction:column}
  .menu button{text-align:left;padding:13px 6px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;font-size:15px}
  .menu button:last-child{border-bottom:none}
  .menu button.del{color:var(--danger)}

  /* labels */
  .labelbar{display:flex;gap:7px;overflow-x:auto;padding:2px 4px 10px;scrollbar-width:none}
  .labelbar::-webkit-scrollbar{display:none}
  .labelbar button{flex:0 0 auto;border:1px solid var(--line);border-radius:16px;padding:4px 12px;font-size:12.5px;color:var(--dim);white-space:nowrap}
  .labelbar button.sel{border-color:var(--gold);color:var(--gold2)}
  .card .labels{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .card .labels span{font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:1px 7px}
  .lblrow{display:flex;flex-direction:column;max-height:44vh;overflow:auto}
  .lblrow label{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:15px}
  .lblrow input{accent-color:var(--gold);width:18px;height:18px;flex:0 0 auto}
  .lblnew{display:flex;gap:8px;align-items:center;padding:14px 0 2px}
  .lblnew input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;outline:none}
  .syncfield{margin:10px 0}
  .syncfield label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
  .syncfield input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;outline:none}

  /* checklist drag */
  .ckrow .drag{width:26px;height:32px;display:grid;place-items:center;color:var(--dim);cursor:grab;flex:0 0 auto;touch-action:none;font-size:15px}
  .ckrow.dragging{background:var(--bg2);box-shadow:0 6px 16px rgba(0,0,0,.5);border-radius:8px;border-bottom-color:transparent}

  /* v1f: fixed X-by-Y board (default 3 x 5 per screen) - every card the same size, its preview scaled
     down to fit; voice memos keep normal-size text */
  .grid.fixed{columns:auto;display:grid;grid-template-columns:repeat(var(--gx,3),minmax(0,1fr));gap:var(--gg,6px)}
  .grid.fixed .card{height:var(--cellh,140px);margin:0;padding:0;border-radius:10px}
  .grid.fixed .card .cin{width:var(--natw,200px);height:calc(var(--cellh,140px) / var(--sc,1));transform:scale(var(--sc,1));transform-origin:0 0;padding:12px;overflow:hidden}
  .grid.fixed .card.voice .cin{width:auto;height:100%;transform:none;padding:8px}
  .grid.fixed .card .excerpt{max-height:none}
  .grid.fixed .card .pin{top:2px;right:2px;width:24px;height:24px;font-size:12px;z-index:2}
  .grid.fixed .card.voice .voicechip{font-size:14px;padding-right:18px}
  .grid.fixed .card.voice .excerpt{font-size:12.5px}
  .txtbtn{height:32px;padding:0 12px;border:1px solid var(--gold);border-radius:16px;color:var(--gold2);font-size:13px;font-weight:600;flex:0 0 auto;white-space:nowrap}
  .txtbtn:active{background:var(--bg2)}
  .txtbtn.on{background:var(--gold);color:#1a1400}
  .editor.tint .txtbtn{color:#3f3a2c;border-color:#6b6555}
  .iconbtn.live{color:#fff;background:var(--danger);animation:pulse 1.2s infinite}
  .brand .ver{font-size:11px;color:var(--gold);font-weight:700}
  .gridrow{display:flex;align-items:center;gap:10px;margin:10px 0}
  .gridrow label{flex:1;font-size:15px}
  .gridrow input{width:70px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px;outline:none;text-align:center;font-size:16px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 90px);background:#000;border:1px solid var(--gold);color:var(--gold2);padding:9px 16px;border-radius:20px;z-index:80;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1}
  .toast .act{margin-left:12px;color:var(--gold2);font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.5px;pointer-events:auto}

  /* ---------- 3a ---------- */
  .labelbar .sep{flex:0 0 1px;background:var(--line);margin:3px 2px}
  /* simple formatting (cards, preview) */
  .md h1,.md h2,.md h3{margin:.25em 0 .2em;line-height:1.25;color:inherit}
  .md h1{font-size:1.3em} .md h2{font-size:1.15em} .md h3{font-size:1.05em}
  .md ul{margin:.2em 0;padding-left:1.2em} .md li{margin:.1em 0}
  .md .mdck{list-style:none;margin-left:-1.2em}
  .md .mdck .bx2{display:inline-block;width:.95em;height:.95em;border:1.5px solid currentColor;border-radius:3px;margin-right:6px;vertical-align:-1px;opacity:.7}
  .md .mdck.done{text-decoration:line-through;opacity:.6}
  .md .mdck.done .bx2{background:var(--gold);border-color:var(--gold);opacity:1}
  .md code{background:rgba(127,127,127,.18);border-radius:4px;padding:0 4px;font-size:.92em}
  .md a,.md .lnk{color:var(--gold2);text-decoration:underline}
  .card:not(.c-none) .md a,.card:not(.c-none) .md .lnk,.editor.tint .md a{color:#7a5f12}
  .card .excerpt.md{white-space:normal}
  .card .excerpt.md p{margin:0 0 .3em}
  .mdview{font-size:16px;line-height:1.55;min-height:50vh;color:var(--ink)}
  .editor.tint .mdview{color:var(--wash-ink)}
  .mdview p{margin:0 0 .5em}
  .mdview .mdck{cursor:pointer}
  .fmtbar{display:flex;gap:6px;align-items:center;margin:0 0 10px;overflow-x:auto;scrollbar-width:none}
  .fmtbar::-webkit-scrollbar{display:none}
  .fmtbar button{flex:0 0 auto;min-width:34px;height:32px;border:1px solid var(--line);border-radius:8px;color:var(--gold2);font-size:14px;padding:0 8px}
  .fmtbar button.on{background:var(--gold);color:#1a1400;border-color:var(--gold)}
  .editor.tint .fmtbar button{border-color:rgba(0,0,0,.2);color:#3f3a2c}
  .editor.tint .fmtbar button.on{background:#3f3a2c;color:#fff}
  /* photos */
  .card .cimg{margin:-12px -12px 8px;display:block;width:calc(100% + 24px);max-height:220px;object-fit:cover}
  .grid.fixed .card .cimg{max-height:none;height:120px}
  .imgstrip{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;scrollbar-width:none}
  .imgstrip::-webkit-scrollbar{display:none}
  .imgstrip img{height:110px;max-width:70vw;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:0 0 auto;cursor:zoom-in}
  .viewer{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column}
  .viewer[hidden]{display:none}
  .viewer .vtop{display:flex;gap:6px;justify-content:flex-end;padding:calc(env(safe-area-inset-top) + 8px) 8px 8px}
  .viewer .vimg{flex:1;display:grid;place-items:center;overflow:auto}
  .viewer img{max-width:100%;max-height:100%;object-fit:contain}
  /* card chips */
  .card .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .card .chip{font-size:10.5px;border:1px solid var(--line);border-radius:10px;padding:1px 7px;color:var(--gold2)}
  .card .chip.late{color:#fff;background:var(--danger);border-color:var(--danger)}
  .card:not(.c-none) .chip{color:#7a5f12;border-color:var(--wash-line)}
  .card .prog{font-size:11px;color:var(--dim);margin-left:auto}
  /* multi-select */
  .card.sel{outline:3px solid var(--gold2);outline-offset:-3px}
  .selbar{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:40;background:#000;border:1px solid var(--gold);border-radius:16px;display:flex;align-items:center;gap:4px;padding:6px 8px;box-shadow:0 8px 24px rgba(0,0,0,.6);max-width:640px;margin:0 auto}
  .selbar[hidden]{display:none}
  .selbar .cnt{color:var(--gold2);font-weight:700;padding:0 6px;flex:1;white-space:nowrap}
  .selbar button{height:38px;min-width:38px;border-radius:10px;color:var(--gold2);font-size:16px;padding:0 6px}
  .selbar button:active{background:var(--bg2)}
  .gensheet .item{display:block;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}

<script>
"use strict";
/* ============================================================
   DSR Notes — v1g
   Local-first Google-Keep-style notepad (text / list / voice / draw)
   Storage: IndexedDB (notes + blob store).
   v1b: labels + label filter, drag-reorder checklist items, undo-delete.
   v1c: optional cross-device sync (Cloudflare Worker + KV, see /worker);
        deletes now leave 30-day tombstones so they propagate.
   v1d: pale note-colour washes (dark ink) on cards + the open editor.
   v1e: board render self-heals a stray null in NOTES (defensive hardening).
   v1f: X-by-Y board grid (default 3 x 5, scaled previews), "Archive" text buttons,
        voice typing + read aloud in text notes and lists.
   v1g: ▦ grid-size button in the top bar; page loads network-first so updates show at once.
   3a: review + features from Keep / Samsung Notes / Apple Notes / Simplenote / Standard Notes:
       photos in any note, simple formatting (bold, italic, headings, bullets, ticks, links) with a
       preview, reminders (+ Google Calendar), a 30-day Trash, long-press multi-select, type filter
       chips, sorting, version history, note <-> checklist, untick all / delete ticked, word counts,
       save as a text file, home-screen shortcuts, share-to-DSR-Notes. Fixes: drawing undo kept up to
       16 full-size canvas snapshots (~100 MB) - now strokes (redo too, smoother lines, pen pressure,
       highlighter); edits in the last 0.6 s before leaving the app were lost; pin/archive didn't sync
       until the next edit; search rebuilt the board on every keystroke.
   ============================================================ */

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const now = () => Date.now();

/* ---------- tiny IndexedDB wrapper ---------- */
const DB = (() => {
  let dbp;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('dsr-notes', 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('notes')) db.createObjectStore('notes', {keyPath:'id'});
        if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs', {keyPath:'key'});
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  const tx = async (store, mode) => (await open()).transaction(store, mode).objectStore(store);
  const done = t => new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  return {
    async all(store){ const s = await tx(store,'readonly');
      return new Promise((res,rej)=>{ const r=s.getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
    async get(store,key){ const s = await tx(store,'readonly');
      return new Promise((res,rej)=>{ const r=s.get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
    async put(store,val){ const s = await tx(store,'readwrite'); s.put(val); return done(s.transaction); },
    async del(store,key){ const s = await tx(store,'readwrite'); s.delete(key); return done(s.transaction); },
  };
})();

/* ---------- state ---------- */
let NOTES = [];                 // in-memory mirror of the notes store
let view  = localStorage.getItem('dsr-notes-view') || 'board';   // 'board' | 'archive'
let query = '';
let cur   = null;               // note currently open in the editor
let curDirty = false;
let saveTimer = null;
let activeLabel = localStorage.getItem('dsr-notes-label') || '';
let pendingDel = null;          // { n, t } — note held for undo after delete
let typeFilter = localStorage.getItem('dsr-notes-type') || '';   // 3a: '' | text | list | voice | draw | img | rem
let sortMode = localStorage.getItem('dsr-notes-sort') || 'edited';  // 3a: edited | created | title
const selected = new Set();     // 3a: multi-select (long-press)

/* ---------- helpers ---------- */
const COLORS = ['none','red','orange','gold','green','teal','blue','purple'];
const COLOR_HEX = {none:'#171717',red:'#e8c4bd',orange:'#efd3b3',gold:'#ece0b0',green:'#cfe0bf',teal:'#bfdedb',blue:'#c6d8ec',purple:'#d8cbe6'};
const COLOR_NAME = {none:'Default',red:'Rose',orange:'Peach',gold:'Butter',green:'Sage',teal:'Mint',blue:'Fog',purple:'Lavender'};

function toast(msg, actLabel, actFn){
  const t = $('#toast');
  t.innerHTML = esc(msg) + (actLabel ? ` <button class="act">${esc(actLabel)}</button>` : '');
  if (actLabel) t.querySelector('.act').onclick = () => { t.classList.remove('show'); actFn && actFn(); };
  t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), actLabel ? 6000 : 1800);
}
/* 3a: a deleted note that still has its content (2b's deletes left empty records - those aren't shown) */
function inTrash(n){ return !!(n && n.deleted && !n.purged && (n.title || n.body || (n.items || []).length || n.transcript || n.thumb || n.imgThumb || (n.images || []).length || n.dur)); }
/* 3a: every blob a note owns (voice, drawing, photos) - used by sync, export, duplicate, trash purge */
function noteBlobKeys(n){ return [n.audioId, n.imageId, ...(n.images || [])].filter(Boolean); }

/* 3a: simple formatting - **bold** *italic* ~~strike~~ `code` # headings, - bullets, - [ ] / - [x] ticks, links.
   card=true renders links as plain styled text (the whole card is one button). */
function mdLite(src, card){
  const inline = t => {
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, card ? '<span class="lnk">$1</span>' : '<a href="$2" target="_blank" rel="noopener">$1</a>')
         .replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, card ? '$1<span class="lnk">$2</span>' : '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
         .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
         .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, '$1<i>$2</i>')
         .replace(/~~([^~]+)~~/g, '<s>$1</s>')
         .replace(/`([^`]+)`/g, '<code>$1</code>');
    return t;
  };
  const out = []; let list = false;
  esc(src || '').split('\n').forEach((ln, i) => {
    let m;
    if ((m = ln.match(/^\s*[-*] \[( |x|X)\] (.*)$/))){
      if (!list){ out.push('<ul>'); list = true; }
      out.push(`<li class="mdck${m[1] === ' ' ? '' : ' done'}" data-ln="${i}"><span class="bx2"></span>${inline(m[2])}</li>`);
      return;
    }
    if ((m = ln.match(/^\s*[-*•] (.*)$/))){
      if (!list){ out.push('<ul>'); list = true; }
      out.push(`<li>${inline(m[1])}</li>`); return;
    }
    if (list){ out.push('</ul>'); list = false; }
    if ((m = ln.match(/^(#{1,3}) (.*)$/))){ out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); return; }
    out.push(ln.trim() ? `<p>${inline(ln)}</p>` : '<p>&nbsp;</p>');
  });
  if (list) out.push('</ul>');
  return out.join('');
}
const hasMd = s => /(\*\*|~~|`|^#{1,3} |^\s*[-*•] |https?:\/\/)/m.test(s || '');

/* 3a: photos are shrunk before they're stored - a 12 MP phone photo is ~5 MB, this keeps it ~300-600 KB */
async function shrinkImage(file, maxPx, q){
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, maxPx / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close && bmp.close();
  return await new Promise(r => c.toBlob(r, 'image/jpeg', q));
}
async function thumbDataURL(blob, px){
  const bmp = await createImageBitmap(blob);
  const sc = px / bmp.width, c = document.createElement('canvas');
  c.width = px; c.height = Math.round(bmp.height * sc);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close && bmp.close();
  return c.toDataURL('image/jpeg', 0.7);
}
function wordCount(n){
  const t = [n.title, n.body, ...(n.items || []).map(i => i.text), n.transcript].filter(Boolean).join(' ');
  return { words: (t.match(/\S+/g) || []).length, chars: t.length };
}

function blobToDataURL(blob){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(blob); });
}
async function dataURLToBlob(u){ return (await fetch(u)).blob(); }
function fmtDur(s){ s=Math.round(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function fmtWhen(ts){
  const d = new Date(ts), t = new Date(), tm = new Date(t); tm.setDate(t.getDate() + 1);
  const hm = d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
  if (d.toDateString() === t.toDateString()) return 'Today ' + hm;
  if (d.toDateString() === tm.toDateString()) return 'Tomorrow ' + hm;
  return d.toLocaleDateString([], { day:'numeric', month:'short' }) + ' ' + hm;
}
function fmtDate(ts){
  const d=new Date(ts), t=new Date();
  const same = d.toDateString()===t.toDateString();
  return same ? d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
             : d.toLocaleDateString([], {day:'numeric',month:'short'});
}

/* ---------- load / persist ---------- */
const TOMB_TTL = 30 * 864e5;   // purge tombstones after 30 days
async function loadNotes(){
  NOTES = (await DB.all('notes')) || [];
  const cut = now() - TOMB_TTL;
  // 3a: deleted notes sit in the Trash for 30 days (content and blobs kept), then go for good
  for (const n of NOTES.filter(x => x.deleted && (x.updated||0) < cut)){
    for (const k of noteBlobKeys(n)) await DB.del('blobs', k);
    await DB.del('notes', n.id);
  }
  NOTES = NOTES.filter(x => !(x.deleted && (x.updated||0) < cut));
}
function scheduleSave(){ curDirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(commit, 600); }
async function commit(){
  if (!cur || !curDirty) return;
  curDirty = false;
  cur.updated = now();
  // 3a: working fields (_snap, _drawTouched ...) stay in memory - they're not stored or synced
  const rec = {}; for (const k in cur) if (k[0] !== '_') rec[k] = cur[k];
  await DB.put('notes', rec);
  const i = NOTES.findIndex(n => n && n.id === cur.id);
  if (i >= 0) NOTES[i] = cur; else NOTES.push(cur);
  maybeAutoSync();
}

/* ============================================================
   BOARD RENDER
   ============================================================ */
function noteMatches(n){
  if (!n || n._deleted) return false;
  if (view === 'trash') return inTrash(n);
  if (n.deleted) return false;
  if (view === 'archive' ? !n.archived : n.archived) return false;
  if (activeLabel && !(n.labels || []).includes(activeLabel)) return false;
  if (typeFilter){                                         // 3a: type chips
    if (typeFilter === 'img'){ if (!(n.images || []).length && n.type !== 'draw') return false; }
    else if (typeFilter === 'rem'){ if (!n.remindAt) return false; }
    else if (n.type !== typeFilter) return false;
  }
  if (!query) return true;
  const hay = [n.title, n.body, ...(n.items||[]).map(i=>i.text), n.transcript, ...(n.labels||[])].join(' ').toLowerCase();
  return hay.includes(query);
}

function renderLabelBar(){
  const bar = $('#labelBar');
  const set = new Set();
  NOTES.forEach(n => { if (n && !n._deleted && !n.deleted) (n.labels || []).forEach(l => set.add(l)); });
  const labels = [...set].sort((a, b) => a.localeCompare(b));
  if (activeLabel && !labels.includes(activeLabel)){ activeLabel = ''; localStorage.removeItem('dsr-notes-label'); }
  if (view === 'trash'){ bar.hidden = true; bar.innerHTML = ''; return; }
  // 3a: type chips first, then the labels
  const TYPES = [['', 'All'], ['text', '✏️ Notes'], ['list', '☑️ Lists'], ['voice', '🎙️ Voice'], ['draw', '🎨 Drawings'], ['img', '🖼 Photos'], ['rem', '⏰ Reminders']];
  bar.hidden = false;
  bar.innerHTML = TYPES.map(([k, t]) => `<button data-t="${k}" class="${typeFilter === k && !activeLabel ? 'sel' : ''}">${t}</button>`).join('') +
    (labels.length ? '<span class="sep"></span>' : '') +
    labels.map(l => `<button data-l="${esc(l)}" class="${activeLabel === l ? 'sel' : ''}"># ${esc(l)}</button>`).join('');
  bar.querySelectorAll('button').forEach(b => b.onclick = () => {
    if (b.dataset.t !== undefined){
      typeFilter = b.dataset.t; activeLabel = '';
      localStorage.setItem('dsr-notes-type', typeFilter); localStorage.removeItem('dsr-notes-label');
    } else {
      activeLabel = activeLabel === b.dataset.l ? '' : b.dataset.l;
      activeLabel ? localStorage.setItem('dsr-notes-label', activeLabel) : localStorage.removeItem('dsr-notes-label');
    }
    renderBoard();
  });
}

/* ---- v1f: X-by-Y board ---- */
const GRID_NAT_W = 200;   // a card's preview is laid out at this width, then scaled to its cell
function gridCfg(){
  try { const g = JSON.parse(localStorage.getItem('dsr-notes-grid')); if (g && g.x >= 1 && g.y >= 1) return g; } catch(e){}
  return { x:3, y:5, free:false };
}
function applyGrid(){
  const g = gridCfg(), main = document.querySelector('main');
  $$('.grid').forEach(el => el.classList.toggle('fixed', !g.free));
  if (g.free) return;
  const gap = 6, cs = getComputedStyle(main);
  const w = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const cellW = (w - gap * (g.x - 1)) / g.x;
  // the rows share the screen below the header (less a section title and the label bar)
  const avail = window.innerHeight - document.querySelector('header').offsetHeight - 34 - ($('#labelBar').hidden ? 0 : 40);
  const cellH = Math.max(48, (avail - gap * (g.y - 1)) / g.y);
  const sc = Math.min(1.25, cellW / GRID_NAT_W);
  main.style.setProperty('--gx', g.x);
  main.style.setProperty('--gg', gap + 'px');
  main.style.setProperty('--cellh', cellH.toFixed(1) + 'px');
  main.style.setProperty('--sc', sc.toFixed(4));
  main.style.setProperty('--natw', GRID_NAT_W + 'px');
}
window.addEventListener('resize', () => applyGrid());
function openGridSheet(){
  const g = gridCfg();
  $('#gridX').value = g.x; $('#gridY').value = g.y; $('#gridFree').checked = !!g.free;
  const save = (x, y, free) => {
    x = Math.min(8, Math.max(1, Math.round(+x) || 3)); y = Math.min(12, Math.max(1, Math.round(+y) || 5));
    localStorage.setItem('dsr-notes-grid', JSON.stringify({ x, y, free }));
    $('#gridSheet').hidden = true; renderBoard();
    toast(free ? 'Free layout' : `Grid ${x} × ${y}`);
  };
  $('#gridSave').onclick = () => save($('#gridX').value, $('#gridY').value, $('#gridFree').checked);
  $('#gridReset').onclick = () => save(3, 5, false);
  $('#gridSheet').hidden = false;
}

function renderBoard(){
  if (NOTES.some(n => !n)) NOTES = NOTES.filter(Boolean);   // self-heal a stray null/undefined
  renderLabelBar();
  const SORTS = {                                          // 3a: sorting
    edited:  (a,b) => (b.updated||0) - (a.updated||0),
    created: (a,b) => (b.created||0) - (a.created||0),
    title:   (a,b) => (a.title || noteAsText(a)).localeCompare(b.title || noteAsText(b), undefined, { sensitivity:'base' }),
  };
  const list = NOTES.filter(noteMatches).sort(SORTS[sortMode] || SORTS.edited);

  const pinned = list.filter(n => n.pinned && view === 'board');
  const others = view !== 'board' ? list : list.filter(n => !n.pinned);

  $('#pinnedSec').hidden = pinned.length === 0;
  $('#othersLabel').hidden = pinned.length === 0;
  $('#pinnedGrid').innerHTML = pinned.map(cardHTML).join('');
  $('#othersGrid').innerHTML = others.map(cardHTML).join('');

  applyGrid();
  const none = list.length === 0;
  $('#empty').hidden = !none;
  $('#emptyMsg').textContent = view === 'archive' ? 'Nothing archived'
    : view === 'trash' ? 'Trash is empty — deleted notes stay here for 30 days'
    : (query || typeFilter || activeLabel ? 'No matches' : 'No notes yet — tap + to start');
  $('.fabwrap').hidden = view === 'trash' || selected.size > 0;
  updateSelBar();
}

/* 3a: one set of listeners for the whole board (2b added one per card on every redraw, every keystroke) */
(function boardEvents(){
  let lp = null, suppress = false;
  ['#pinnedGrid', '#othersGrid'].forEach(id => {
    const g = $(id);
    g.addEventListener('pointerdown', e => {
      const el = e.target.closest('.card'); if (!el) return;
      const x0 = e.clientX, y0 = e.clientY;
      clearTimeout(lp && lp.t);
      lp = { el, x0, y0, t: setTimeout(() => { suppress = true; toggleSelect(el.dataset.id); navigator.vibrate && navigator.vibrate(15); }, 480) };
    });
    g.addEventListener('pointermove', e => { if (lp && Math.hypot(e.clientX - lp.x0, e.clientY - lp.y0) > 10){ clearTimeout(lp.t); lp = null; } });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => g.addEventListener(ev, () => { if (lp){ clearTimeout(lp.t); lp = null; } }));
    g.addEventListener('contextmenu', e => { if (e.target.closest('.card')) e.preventDefault(); });
    g.addEventListener('click', e => {
      const el = e.target.closest('.card'); if (!el) return;
      if (suppress){ suppress = false; return; }
      const n = NOTES.find(x => x.id === el.dataset.id); if (!n) return;
      if (selected.size){ toggleSelect(n.id); return; }
      if (view === 'trash'){ trashMenu(n); return; }
      if (e.target.closest('.pin')){ togglePin(n); return; }
      openEditor(n);
    });
  });
})();
let qTimer = null;

function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function cardHTML(n){
  let inner = '';
  if (n.type === 'draw' && n.thumb){
    inner += `<img class="thumb" src="${n.thumb}" alt="">`;
  } else if (n.imgThumb){                                    // 3a: first photo heads the card
    inner += `<img class="cimg" src="${n.imgThumb}" alt="" loading="lazy">`;
  }
  if (n.title) inner += `<h3>${esc(n.title)}</h3>`;

  if (n.type === 'text' && n.body){
    const b = n.body.slice(0, 700);
    inner += hasMd(b) ? `<div class="excerpt md">${mdLite(b, true)}</div>` : `<div class="excerpt">${esc(b)}</div>`;
  } else if (n.type === 'list'){
    const items = (n.items||[]).slice(0,8);
    inner += `<ul class="cklist">` + items.map(it =>
      `<li class="${it.done?'done':''}"><span class="bx"></span><span>${esc(it.text)}</span></li>`).join('') +
      ((n.items||[]).length>8 ? `<li style="color:var(--dim)">+${n.items.length-8} more</li>` : '') +
      `</ul>`;
  } else if (n.type === 'voice'){
    inner += `<div class="voicechip">🎙️ <span>${n.dur?fmtDur(n.dur):'Voice memo'}</span></div>`;
    if (n.transcript) inner += `<div class="excerpt" style="margin-top:6px">${esc(n.transcript).slice(0,300)}</div>`;
  }

  if ((n.labels || []).length)
    inner += `<div class="labels">` + n.labels.map(l => `<span>${esc(l)}</span>`).join('') + `</div>`;
  const chips = [];
  if (n.remindAt){                                          // 3a: reminder chip
    const late = !n.remindFired && n.remindAt < now();
    chips.push(`<span class="chip${late || (n.remindFired && n.remindAt < now() && !n.remindDone) ? ' late' : ''}">⏰ ${fmtWhen(n.remindAt)}</span>`);
  }
  if ((n.images || []).length > 1) chips.push(`<span class="chip">🖼 ${n.images.length}</span>`);
  if (chips.length) inner += `<div class="chips">${chips.join('')}</div>`;
  const prog = n.type === 'list' && (n.items || []).length ? `<span class="prog">${n.items.filter(i => i.done).length}/${n.items.length} ✓</span>` : '';
  inner += `<div class="meta"><span>${fmtDate(n.updated||n.created)}</span>${prog}</div>`;
  if (n.deleted){
    const left = Math.max(0, Math.ceil(((n.updated || 0) + TOMB_TTL - now()) / 864e5));
    inner += `<div class="trashnote">Deleted · gone for good in ${left} day${left === 1 ? '' : 's'}</div>`;
  }

  return `<button class="card c-${n.color||'none'} ${n.pinned?'pinned':''} ${n.type==='voice'?'voice':''} ${selected.has(n.id)?'sel':''}" data-id="${n.id}">
    <span class="pin ${n.pinned?'on':''}" title="Pin">📌</span>
    <div class="cin">${inner}</div>
  </button>`;
}

/* ============================================================
   NOTE ACTIONS
   ============================================================ */
async function togglePin(n){
  n.pinned = !n.pinned; n.updated = now();
  await DB.put('notes', n);
  toast(n.pinned ? 'Pinned' : 'Unpinned');
  renderBoard(); maybeAutoSync();              // 3a: synced straight away (2b waited for the next edit)
}
async function toggleArchive(n){
  n.archived = !n.archived; n.updated = now();
  await DB.put('notes', n);
  const j = NOTES.findIndex(x=>x.id===n.id); if (j>=0) NOTES[j]=n;
  toast(n.archived ? 'Archived' : 'Restored');
  maybeAutoSync();
}
async function deleteNote(n){
  // 3a: to the Trash - the note keeps its content and blobs for 30 days (restorable), and the deletion
  // still travels through sync; after 30 days loadNotes() removes it for good
  delete n._deleted;
  n.deleted = true; n.pinned = false; n.updated = now();
  await DB.put('notes', n);
  const i = NOTES.findIndex(x => x.id === n.id);
  if (i >= 0) NOTES[i] = n; else NOTES.push(n);
  maybeAutoSync();
}
async function restoreNote(n){
  n.deleted = false; n.updated = now();
  await DB.put('notes', n); maybeAutoSync();
}
async function purgeNote(n){
  for (const k of noteBlobKeys(n)) await DB.del('blobs', k);
  const tomb = { id: n.id, type: n.type, deleted: true, purged: true, updated: now() };
  await DB.put('notes', tomb);
  const i = NOTES.findIndex(x => x.id === n.id); if (i >= 0) NOTES[i] = tomb;
  maybeAutoSync();
}
function trashMenu(n){
  openMenuSheet([
    { label:'Restore', icon:'↺', fn: async () => { await restoreNote(n); renderBoard(); toast('Restored'); } },
    { label:'Delete for good', icon:'🗑', cls:'del', fn: async () => { await purgeNote(n); renderBoard(); toast('Deleted for good'); } },
  ]);
}

async function flushPendingDelete(){

   EDITOR
   ============================================================ */
const editor = $('#editor'), ebody = $('#ebody');
let audioURL = null, mediaRec = null, recChunks = [], recTimer = null, recStart = 0, recognizer = null;

function newNote(type){
  return { id:uuid(), type, title:'', body:'', items:[], labels:[], color:'none',
           pinned:false, archived:false, created:now(), updated:now(),
           audioId:null, imageId:null, dur:0, transcript:'', thumb:'', images:[], imgThumb:'' };
}

function applyEditorTint(){
  const on = cur && cur.color && cur.color !== 'none';
  editor.classList.toggle('tint', !!on);
  editor.style.setProperty('--note-wash', on ? COLOR_HEX[cur.color] : 'transparent');
}

async function openEditor(noteOrType){
  await flushPendingDelete();
  if (typeof noteOrType === 'string') { cur = newNote(noteOrType); curDirty = true; }
  else { cur = noteOrType; curDirty = false; }
  cur.labels = cur.labels || [];

  $('#ePin').style.color = cur.pinned ? 'var(--gold2)' : '';
  $('#ePin').style.opacity = cur.pinned ? '1' : '.5';

  if (cur.type === 'text')  buildTextEditor();
  if (cur.type === 'list')  buildListEditor();
  if (cur.type === 'voice') await buildVoiceEditor();
  if (cur.type === 'draw')  await buildDrawEditor();
  // 3a: photos strip (any note but drawings) + what the note looked like when opened (version history)
  if (cur.type !== 'draw'){ const st = document.createElement('div'); st.className = 'imgstrip'; st.id = 'imgStrip'; ebody.prepend(st); renderImgStrip(); }
  cur._snap = snapOf(cur); cur._snapT = cur.updated;
}

/* ---------- 3a: version history (text + lists) ---------- */
function snapOf(n){ return (n.type === 'text' || n.type === 'list') ? JSON.stringify({ title: n.title || '', body: n.body || '', items: (n.items || []).map(i => ({ text: i.text, done: !!i.done })) }) : null; }
function recordHistory(){
  if (!cur || !cur._snap) return;
  const nowSnap = snapOf(cur);
  if (nowSnap !== cur._snap){
    const old = JSON.parse(cur._snap);
    if (old.title || old.body || old.items.length){
      cur.history = [{ t: cur._snapT || cur.updated || now(), ...old }, ...(cur.history || [])].slice(0, 10);
      curDirty = true;
    }
  }
  delete cur._snap; delete cur._snapT;
}
function openHistory(){
  const h = cur.history || [];
  if (!h.length){ toast('No earlier versions yet'); return; }
  genSheet('Version history', h.map((v, i) => `<button class="item" data-i="${i}">${new Date(v.t).toLocaleString()}<small>${esc(v.title || '')} ${esc((v.body || v.items.map(x => x.text).join(', ')).slice(0, 90))}</small></button>`).join(''), body => {
    body.querySelectorAll('.item').forEach(b => b.onclick = () => {
      const v = h[+b.dataset.i];
      const before = JSON.parse(snapOf(cur));
      cur.history = [{ t: now(), ...before }, ...h.filter((_, j) => j !== +b.dataset.i)].slice(0, 10);
      cur.title = v.title; cur.body = v.body; cur.items = v.items.map(x => ({ ...x, id: uuid() }));
      closeGen(); scheduleSave();
      const keep = cur; cur._snap = snapOf(cur); openEditor(keep).then(() => toast('Earlier version restored'));
    });
  });
}

/* ---------- 3a: photos in any note ---------- */
let stripURLs = [];
async function renderImgStrip(){
  const st = $('#imgStrip'); if (!st || !cur) return;
  stripURLs.forEach(u => URL.revokeObjectURL(u)); stripURLs = [];
  st.innerHTML = '';
  for (const k of (cur.images || [])){
    const rec = await DB.get('blobs', k); if (!rec) continue;
    const u = URL.createObjectURL(rec.blob); stripURLs.push(u);
    const im = document.createElement('img'); im.src = u; im.alt = ''; im.onclick = () => openViewer(k, u);
    st.appendChild(im);
  }
  st.hidden = !st.children.length;
}
async function addPhotos(files){
  if (!cur || !files.length) return;
  cur.images = cur.images || [];
  toast('Adding photo' + (files.length > 1 ? 's' : '') + '…');
  for (const f of files){
    try {
      const blob = await shrinkImage(f, 2048, 0.85), k = uuid();
      await DB.put('blobs', { key: k, blob });
      cur.images.push(k);
      if (!cur.imgThumb) cur.imgThumb = await thumbDataURL(blob, 400);
    } catch(e){ toast("Couldn't read that image"); }
  }
  scheduleSave(); renderImgStrip();
}
$('#attachFile').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; addPhotos(fs); });
let viewerKey = null;
function openViewer(k, url){ viewerKey = k; $('#vImg').src = url; $('#viewer').hidden = false; }
$('#vClose').onclick = () => { $('#viewer').hidden = true; viewerKey = null; };
$('#vDel').onclick = async () => {

  const k = viewerKey;
  cur.images = (cur.images || []).filter(x => x !== k);
  await DB.del('blobs', k);
  if (cur.images.length){ const rec = await DB.get('blobs', cur.images[0]); cur.imgThumb = rec ? await thumbDataURL(rec.blob, 400) : ''; }
  else cur.imgThumb = '';

}

/* ---- v1f: voice typing (text notes + lists) ----
   One phrase at a time (continuous=false, restarted while on): Android Chrome's continuous mode repeats
   earlier words in later results. Text note: the phrase goes in at the cursor. List: each phrase is a new item. */
let dict = null;   // { sr, on }
function stopDictation(){
  if (!dict) return;
  dict.on = false; try { dict.sr.abort(); } catch(e){}
  dict = null; $('#eMic').classList.remove('live');
}
function startDictation(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ toast("Voice typing isn't supported in this browser"); return; }
  stopSpeaking();
  const sr = new SR(); sr.continuous = false; sr.interimResults = false; sr.maxAlternatives = 1;
  sr.lang = navigator.language || 'en-GB';
  dict = { sr, on: true };
  sr.onresult = e => {
    const t = [...e.results].filter(r => r.isFinal).map(r => r[0].transcript).join(' ').trim();
    if (t && cur) addDictated(t);
  };
  sr.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){ toast('Microphone blocked'); stopDictation(); }
  };
  sr.onend = () => { if (dict && dict.sr === sr && dict.on){ try { sr.start(); } catch(e){ stopDictation(); } } };
  try { sr.start(); } catch(e){ stopDictation(); return; }
  $('#eMic').classList.add('live');
  toast(cur && cur.type === 'list' ? 'Listening — each phrase becomes a list item' : 'Listening — speak, tap 🎤 to stop');
}
function addDictated(t){
  if (cur.type === 'list'){
    const nw = $('#ckNew'); if (nw && nw.value.trim()){ cur.items.push({ text: nw.value.trim(), done:false }); nw.value = ''; }
    cur.items.push({ text: t.charAt(0).toUpperCase() + t.slice(1), done:false });
    renderCkList(); scheduleSave();
    return;
  }
  const ta = $('#fBody'); if (!ta) return;
  const a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? a;
  const before = ta.value.slice(0, a), after = ta.value.slice(b);
  const sentenceStart = !before.trim() || /[.!?\n]\s*$/.test(before);
  let ins = sentenceStart ? t.charAt(0).toUpperCase() + t.slice(1) : t;
  if (before && !/\s$/.test(before)) ins = ' ' + ins;
  if (after && !/^\s/.test(after)) ins += ' ';
  ta.value = before + ins + after;
  const pos = (before + ins).length; ta.selectionStart = ta.selectionEnd = pos;
  cur.body = ta.value; autoGrow(ta); scheduleSave();
}
$('#eMic').onclick = () => dict ? stopDictation() : startDictation();

/* ---- v1f: read aloud (text notes + lists) ---- */
function stopSpeaking(){ try { speechSynthesis.cancel(); } catch(e){} $('#eSpeak').classList.remove('live'); }
function speakCur(){
  if (!('speechSynthesis' in window)){ toast("Read aloud isn't supported in this browser"); return; }
  if (speechSynthesis.speaking || $('#eSpeak').classList.contains('live')){ stopSpeaking(); return; }
  stopDictation();
  const parts = [];
  if (cur.title) parts.push(cur.title + '.');
  if (cur.type === 'list') (cur.items || []).forEach(it => { if (it.text) parts.push(it.text + (it.done ? ', ticked.' : '.')); });
  else if (cur.body) parts.push(cur.body);
  if (!parts.length){ toast('Nothing to read'); return; }
  // long strings cut out part-way in some browsers - read it a sentence at a time
  const chunks = (parts.join('\n').match(/[^.!?\n]+[.!?]*/g) || []).map(x => x.trim()).filter(Boolean);
  const lang = navigator.language || 'en-GB', vs = speechSynthesis.getVoices();
  const voice = vs.find(v => v.lang === lang) || vs.find(v => v.lang.slice(0, 2) === lang.slice(0, 2));
  chunks.forEach((c, i) => {
    const u = new SpeechSynthesisUtterance(c); u.lang = lang; if (voice) u.voice = voice;
    if (i === chunks.length - 1) u.onend = u.onerror = () => $('#eSpeak').classList.remove('live');
    speechSynthesis.speak(u);
  });
  $('#eSpeak').classList.add('live');
}
$('#eSpeak').onclick = () => speakCur();

async function closeEditor(){
  stopDictation(); stopSpeaking();
  // stop any recording / recognition
  if (mediaRec && mediaRec.state === 'recording') await stopRecording();
  if (recognizer) { try{ recognizer.stop(); }catch(e){} recognizer = null; }
  if (audioURL) { URL.revokeObjectURL(audioURL); audioURL = null; }

  if (cur && cur.type === 'draw') await saveDrawing();   // capture final canvas
  recordHistory();                                         // 3a
  clearTimeout(saveTimer);
  await commit();
  stripURLs.forEach(u => URL.revokeObjectURL(u)); stripURLs = [];
  $('#viewer').hidden = true;

  // discard genuinely empty brand-new notes
  const empty = cur && !cur.title && !cur.body &&
                !(cur.items||[]).length && !cur.audioId && !cur.imageId && !(cur.images||[]).length;
  if (empty){ await DB.del('notes', cur.id); NOTES = NOTES.filter(n=>n.id!==cur.id); }

  cur = null;
  editor.hidden = true;
  editor.classList.remove('tint');
  renderBoard();
}

/* ---- text ---- */
function buildTextEditor(){
  ebody.innerHTML = `
    <input class="etitle" id="fTitle" placeholder="Title" value="${esc(cur.title)}">
    <div class="fmtbar" id="fmtBar">
      <button data-f="b" title="Bold"><b>B</b></button>
      <button data-f="i" title="Italic"><i>I</i></button>
      <button data-f="s" title="Strikethrough"><s>S</s></button>
      <button data-f="h" title="Heading">H</button>
      <button data-f="ul" title="Bullet">•</button>
      <button data-f="ck" title="Tick box">☐</button>
      <button data-f="ln" title="Link">🔗</button>
      <button data-f="pv" id="pvBtn" title="Preview - see the formatting, tap ticks and links">👁 Preview</button>
    </div>
    <textarea class="etext" id="fBody" placeholder="Note…">${esc(cur.body)}</textarea>
    <div class="mdview md" id="mdView" hidden></div>`;
  $('#fTitle').oninput = e => { cur.title = e.target.value; scheduleSave(); };
  const ta = $('#fBody');
  ta.oninput = e => { cur.body = e.target.value; scheduleSave(); autoGrow(ta); };
  autoGrow(ta);
  $('#fmtBar').onclick = e => { const b = e.target.closest('button'); if (b) fmt(b.dataset.f); };
  $('#mdView').onclick = e => {                              // tap a tick in the preview to tick it
    const li = e.target.closest('.mdck'); if (!li || e.target.closest('a')) return;
    const lines = cur.body.split('\n'), i = +li.dataset.ln;
    lines[i] = lines[i].replace(/\[( |x|X)\]/, m => m === '[ ]' ? '[x]' : '[ ]');
    cur.body = ta.value = lines.join('\n'); scheduleSave(); $('#mdView').innerHTML = mdLite(cur.body);
  };
}
/* 3a: formatting - wraps the selection, or starts the current line(s) with a marker */
function fmt(f){
  const ta = $('#fBody'), pv = $('#mdView');
  if (f === 'pv'){
    const show = pv.hidden;
    pv.hidden = !show; ta.hidden = show;
    if (show) pv.innerHTML = mdLite(cur.body);
    $('#pvBtn').classList.toggle('on', show); $('#pvBtn').textContent = show ? '✎ Edit' : '👁 Preview';
    return;
  }
  if (ta.hidden) fmt('pv');
  const a = ta.selectionStart, b = ta.selectionEnd, v = ta.value, sel = v.slice(a, b);
  const wrap = (l, r, ph) => { const t = sel || ph; ta.value = v.slice(0, a) + l + t + r + v.slice(b); ta.selectionStart = a + l.length; ta.selectionEnd = a + l.length + t.length; };
  const prefix = (m) => {
    const ls = v.lastIndexOf('\n', a - 1) + 1, le = v.indexOf('\n', b) < 0 ? v.length : v.indexOf('\n', b);
    const block = v.slice(ls, le).split('\n').map(l => l.startsWith(m) ? l.slice(m.length) : m + l).join('\n');
    ta.value = v.slice(0, ls) + block + v.slice(le); ta.selectionStart = ta.selectionEnd = ls + block.length;
  };
  if (f === 'b') wrap('**', '**', 'bold');
  if (f === 'i') wrap('*', '*', 'italic');
  if (f === 's') wrap('~~', '~~', 'text');
  if (f === 'h') prefix('# ');
  if (f === 'ul') prefix('- ');
  if (f === 'ck') prefix('- [ ] ');
  if (f === 'ln'){ const u = prompt('Link address (https://…)', 'https://'); if (!u || u === 'https://') return; wrap('[', '](' + u.trim() + ')', 'link'); }
  ta.focus(); cur.body = ta.value; autoGrow(ta); scheduleSave();
}
function autoGrow(ta){ ta.style.height='auto'; ta.style.height = Math.max(ta.scrollHeight, 260)+'px'; }

/* ---- checklist ---- */
function buildListEditor(){
  cur.items = cur.items || [];
  ebody.innerHTML = `
    <input class="etitle" id="fTitle" placeholder="Title" value="${esc(cur.title)}">
    <ul class="ckedit" id="ckList"></ul>
    <div class="ckadd"><button id="ckAddBtn" style="color:var(--gold2);font-size:18px;width:24px">＋</button><input id="ckNew" placeholder="List item" autocomplete="off" enterkeyhint="done"></div>
    <label class="cktoggle"><input type="checkbox" id="ckSink" ${cur.sinkDone?'checked':''}> Move ticked items to the bottom</label>`;
  $('#fTitle').oninput = e => { cur.title = e.target.value; scheduleSave(); };
  $('#ckSink').onchange = e => { cur.sinkDone = e.target.checked; renderCkList(); scheduleSave(); };
  const nw = $('#ckNew');
  const addPending = () => {
    const v = nw.value.trim();
    if (!v) return;
    cur.items.push({ text: v, done:false });
    nw.value = ''; renderCkList(); scheduleSave();
  };
  nw.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addPending(); } });
  nw.addEventListener('blur', addPending);
  $('#ckAddBtn').onclick = () => { addPending(); nw.focus(); };
  renderCkList();
}
function orderedItems(){
  cur.items.forEach(it => { if (!it.id) it.id = uuid(); });
  const arr = cur.items.map((it,i) => ({it,i}));
  if (cur.sinkDone) arr.sort((a,b) => (a.it.done - b.it.done) || (a.i - b.i));
  return arr;
}
function renderCkList(){
  const ul = $('#ckList'); if (!ul) return;
  ul.innerHTML = '';
  const canDrag = !cur.sinkDone;
  orderedItems().forEach(({it}) => {
    const li = document.createElement('li');
    li.className = 'ckrow' + (it.done ? ' done' : '');
    li.dataset.id = it.id;
    li.innerHTML = `
      ${canDrag ? '<button class="drag" data-a="drag" title="Drag to reorder">⠿</button>' : ''}
      <button class="bx" data-a="tick">${it.done?'✓':''}</button>
      <input class="txt" value="${esc(it.text)}">
      <button class="rm" data-a="rm">✕</button>`;
    li.querySelector('.txt').oninput = e => { it.text = e.target.value; scheduleSave(); };
    li.querySelector('[data-a="tick"]').onclick = () => { it.done = !it.done; renderCkList(); scheduleSave(); };
    li.querySelector('[data-a="rm"]').onclick = () => { cur.items = cur.items.filter(x => x !== it); renderCkList(); scheduleSave(); };
    const dh = li.querySelector('[data-a="drag"]');
    if (dh) dh.addEventListener('pointerdown', e => startRowDrag(e, li, ul));
    ul.appendChild(li);
  });
}
function startRowDrag(e, li, ul){
  e.preventDefault();
  li.classList.add('dragging');
  try { li.setPointerCapture(e.pointerId); } catch(_){}
  const move = ev => {
    const rows = [...ul.querySelectorAll('.ckrow:not(.dragging)')];
    let ref = null;
    for (const r of rows){ const b = r.getBoundingClientRect(); if (ev.clientY < b.top + b.height/2){ ref = r; break; } }
    if (ref !== li.nextElementSibling) ul.insertBefore(li, ref);
  };
  const up = () => {
    li.classList.remove('dragging');
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    const order = [...ul.children].map(x => x.dataset.id);
    cur.items.sort((a,b) => order.indexOf(a.id) - order.indexOf(b.id));
    scheduleSave();
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

async function buildVoiceEditor(){
  ebody.innerHTML = `
    <input class="etitle" id="fTitle" placeholder="Title" value="${esc(cur.title)}">
    <div class="voicebox">
      <button class="recbtn" id="recBtn">●</button>
      <div class="rectime" id="recTime">0:00</div>
      <div class="rechint" id="recHint">Tap to record</div>
      <div class="player" id="player" hidden></div>
    </div>
    <div class="rechint" style="text-align:left;margin-bottom:4px">Transcript (auto — edit freely)</div>
    <div class="transcript" id="tr" contenteditable="true">${esc(cur.transcript)}</div>`;
  $('#fTitle').oninput = e => { cur.title = e.target.value; scheduleSave(); };
  $('#tr').addEventListener('input', e => { cur.transcript = e.target.innerText; scheduleSave(); });
  $('#recBtn').onclick = () => (mediaRec && mediaRec.state === 'recording') ? stopRecording() : startRecording();

  if (cur.audioId){
    const rec = await DB.get('blobs', cur.audioId);
    if (rec) showPlayer(rec.blob);
  }
}
function showPlayer(blob){
  if (audioURL) URL.revokeObjectURL(audioURL);
  audioURL = URL.createObjectURL(blob);
  const p = $('#player'); p.hidden = false;
  p.innerHTML = `<audio controls src="${audioURL}"></audio>`;
  $('#recHint').textContent = cur.dur ? fmtDur(cur.dur)+' recorded — tap ● to replace' : 'Recorded';
}
async function startRecording(){
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast('Microphone blocked'); return; }
  recChunks = [];
  mediaRec = new MediaRecorder(stream);
  mediaRec.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
  mediaRec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    const blob = new Blob(recChunks, { type: mediaRec.mimeType || 'audio/webm' });
    cur.dur = (now() - recStart) / 1000;
    cur.audioId = cur.audioId || uuid();
    await DB.put('blobs', { key: cur.audioId, blob });
    scheduleSave();
    showPlayer(blob);
  };
  mediaRec.start();
  recStart = now();
  $('#recBtn').classList.add('recording');
  $('#recBtn').textContent = '■';
  $('#recHint').textContent = 'Recording — tap to stop';
  recTimer = setInterval(() => { $('#recTime').textContent = fmtDur((now()-recStart)/1000); }, 250);
  startRecognition();
}
async function stopRecording(){
  return new Promise(res => {
    clearInterval(recTimer);
    $('#recBtn').classList.remove('recording');
    $('#recBtn').textContent = '●';
    if (recognizer) { try{ recognizer.stop(); }catch(e){} recognizer = null; }
    if (mediaRec && mediaRec.state === 'recording'){ mediaRec.addEventListener('stop', res, {once:true}); mediaRec.stop(); }
    else res();
  });
}
function startRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;                       // silently skip where unsupported (e.g. Firefox)
  recognizer = new SR();
  recognizer.continuous = true;
  recognizer.interimResults = false;
  recognizer.lang = navigator.language || 'en-US';
  const trEl = $('#tr');
  recognizer.onresult = e => {
    let add = '';
    for (let i = e.resultIndex; i < e.results.length; i++)
      if (e.results[i].isFinal) add += e.results[i][0].transcript;
    if (add){
      trEl.innerText = (trEl.innerText ? trEl.innerText.trim() + ' ' : '') + add.trim();
      cur.transcript = trEl.innerText; scheduleSave();
    }
  };
  recognizer.onerror = () => {};
  try { recognizer.start(); } catch(e){}
}

/* ---- drawing ----
   3a: undo/redo by strokes. 2b kept up to 16 full 1080x1440 snapshots (6 MB each, ~100 MB) for undo - heavy
   on a phone. Now the picture is the background it opened with + a list of strokes; undo drops the last one
   and redraws. Smoother lines (all the pointer's in-between points), pen pressure, and a highlighter. */
let pad, pctx, drawing = false, penColor = '#111111', penSize = 4, tool = 'pen', strokes = [], redoStack = [], live = null, baseBmp = null;
const PAD_W = 1080, PAD_H = 1440;

async function buildDrawEditor(){
  ebody.className = 'ebody';
  ebody.style.maxWidth = 'none'; ebody.style.padding = '0';
  ebody.innerHTML = `
    <div class="drawwrap">
      <input class="etitle" id="fTitle" placeholder="Title" value="${esc(cur.title)}" style="margin:12px 16px 8px">
      <div class="canvashold"><canvas id="pad" width="${PAD_W}" height="${PAD_H}"></canvas></div>
      <div class="tools" id="tools">
        <button class="tbtn" id="tPen" title="Pen">✎</button>
        <button class="tbtn" id="tHi" title="Highlighter">🖍</button>
        <button class="tbtn" id="tErase" title="Eraser">⌫</button>
        <input type="range" id="tSize" min="1" max="40" value="${penSize}">
        <span id="swatches" style="display:flex;gap:8px"></span>
        <button class="tbtn" id="tPhoto" title="Add photo">🖼</button>
        <button class="tbtn" id="tUndo" title="Undo">↺</button>
        <button class="tbtn" id="tRedo" title="Redo">↻</button>
        <button class="tbtn" id="tClear" title="Clear">🗑</button>
      </div>
    </div>`;
  $('#fTitle').oninput = e => { cur.title = e.target.value; scheduleSave(); };

  pad = $('#pad'); pctx = pad.getContext('2d');
  strokes = []; redoStack = []; baseBmp = null;
  if (cur.imageId){
    const rec = await DB.get('blobs', cur.imageId);
    if (rec) try { baseBmp = await createImageBitmap(rec.blob); } catch(e){}
  }
  redrawAll();

  const cols = ['#111111','#c0563e','#e07b2a','#d4af37','#3a9d5d','#2aa7a0','#3a86c9','#8659c9','#d14f9a','#ffffff'];
  $('#swatches').innerHTML = cols.map(c => `<button class="swatch" data-c="${c}" style="background:${c}"></button>`).join('');
  const selSwatch = c => $$('#swatches .swatch').forEach(s => s.classList.toggle('sel', s.dataset.c === c));
  $$('#swatches .swatch').forEach(s => s.onclick = () => { penColor = s.dataset.c; if (tool === 'eraser') tool = 'pen'; setTool(); selSwatch(penColor); });
  selSwatch(penColor);

  $('#tSize').oninput = e => { penSize = +e.target.value; };
  $('#tPen').onclick   = () => { tool = 'pen'; setTool(); };
  $('#tHi').onclick    = () => { tool = 'hi'; setTool(); };
  $('#tErase').onclick = () => { tool = 'eraser'; setTool(); };
  $('#tUndo').onclick  = () => { const st = strokes.pop(); if (st){ redoStack.push(st); redrawAll(); markDraw(); } };
  $('#tRedo').onclick  = () => { const st = redoStack.pop(); if (st){ strokes.push(st); redrawAll(); markDraw(); } };
  $('#tClear').onclick = () => { strokes.push({ mode:'clear' }); redoStack = []; redrawAll(); markDraw(); };
  $('#tPhoto').onclick = () => $('#photoFile').click();
  setTool();

  pad.addEventListener('pointerdown', pStart);
  pad.addEventListener('pointermove', pMove);
  pad.addEventListener('pointerup',   pEnd);
  pad.addEventListener('pointercancel', pEnd);
}
function setTool(){
  [['#tPen','pen'],['#tHi','hi'],['#tErase','eraser']].forEach(([id, t]) => { const b = $(id); if (b) b.classList.toggle('sel', tool === t); });
}
function padPos(e){
  const r = pad.getBoundingClientRect();
  return { x:(e.clientX - r.left) * (PAD_W / r.width), y:(e.clientY - r.top) * (PAD_H / r.height),
           p: e.pointerType === 'pen' && e.pressure ? e.pressure : 0.5 };
}
function strokeStyle(st){
  pctx.globalCompositeOperation = st.mode === 'hi' ? 'multiply' : 'source-over';
  pctx.globalAlpha = st.mode === 'hi' ? 0.35 : 1;
  pctx.strokeStyle = pctx.fillStyle = st.mode === 'eraser' ? '#ffffff' : st.color;
  pctx.lineCap = 'round'; pctx.lineJoin = 'round';
}
const widthAt = (st, p) => st.mode === 'eraser' ? st.size * 2.2 : st.mode === 'hi' ? st.size * 3 : st.size * (0.6 + p * 0.8);
function drawSeg(st, a, b){
  strokeStyle(st);
  pctx.lineWidth = widthAt(st, b.p);
  pctx.beginPath(); pctx.moveTo(a.x, a.y); pctx.lineTo(b.x, b.y); pctx.stroke();
}
function drawStroke(st){
  if (st.mode === 'clear'){ pctx.globalAlpha = 1; pctx.globalCompositeOperation = 'source-over'; pctx.fillStyle = '#fff'; pctx.fillRect(0, 0, PAD_W, PAD_H); return; }
  if (st.mode === 'image'){ pctx.globalAlpha = 1; pctx.globalCompositeOperation = 'source-over'; pctx.fillStyle = '#fff'; pctx.fillRect(0, 0, PAD_W, PAD_H);
    const s2 = Math.min(PAD_W / st.bmp.width, PAD_H / st.bmp.height), w = st.bmp.width * s2, h = st.bmp.height * s2;
    pctx.drawImage(st.bmp, (PAD_W - w) / 2, (PAD_H - h) / 2, w, h); return; }
  const P = st.pts;
  if (P.length === 1){ strokeStyle(st); pctx.beginPath(); pctx.arc(P[0].x, P[0].y, widthAt(st, P[0].p) / 2, 0, 7); pctx.fill(); return; }
  if (st.mode === 'hi'){                      // one path, so the see-through ink doesn't darken where segments overlap
    strokeStyle(st); pctx.lineWidth = widthAt(st, 0.5);
    pctx.beginPath(); pctx.moveTo(P[0].x, P[0].y); for (let k = 1; k < P.length; k++) pctx.lineTo(P[k].x, P[k].y); pctx.stroke(); return;
  }
  for (let k = 1; k < P.length; k++) drawSeg(st, P[k - 1], P[k]);
}
function redrawAll(){
  pctx.globalAlpha = 1; pctx.globalCompositeOperation = 'source-over';
  pctx.fillStyle = '#fff'; pctx.fillRect(0, 0, PAD_W, PAD_H);
  if (baseBmp) pctx.drawImage(baseBmp, 0, 0, PAD_W, PAD_H);
  strokes.forEach(drawStroke);
  pctx.globalAlpha = 1; pctx.globalCompositeOperation = 'source-over';
}
function pStart(e){
  pad.setPointerCapture(e.pointerId); drawing = true; redoStack = [];
  live = { mode: tool, color: penColor, size: penSize, pts: [padPos(e)] };
  if (tool !== 'hi') drawStroke(live);
}
function pMove(e){
  if (!drawing || !live) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])){
    const p = padPos(ev), a = live.pts[live.pts.length - 1];
    live.pts.push(p);
    if (live.mode === 'hi'){ redrawAll(); drawStroke(live); } else drawSeg(live, a, p);
  }
}
function pEnd(){
  if (!drawing) return;
  drawing = false;
  if (live){ strokes.push(live); live = null; redrawAll(); markDraw(); }
}
function markDraw(){ cur._drawTouched = true; scheduleSave(); }

async function saveDrawing(){
  if (!pad || !cur._drawTouched && cur.imageId) return;
  if (!pad) return;
  const blob = await new Promise(r => pad.toBlob(r, 'image/png'));
  if (!blob) return;
  cur.imageId = cur.imageId || uuid();
  await DB.put('blobs', { key: cur.imageId, blob });
  // small thumbnail for the board card
  const tc = document.createElement('canvas');
  tc.width = 400; tc.height = Math.round(400 * PAD_H / PAD_W);
  tc.getContext('2d').drawImage(pad, 0, 0, tc.width, tc.height);
  cur.thumb = tc.toDataURL('image/jpeg', 0.7);
  curDirty = true;
}
$('#photoFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !pad) return;
  try {
    const bmp = await createImageBitmap(f);
    strokes.push({ mode:'image', bmp }); redoStack = [];     // undo-able like any stroke
    redrawAll(); markDraw();
  } catch(err){ toast("Couldn't read that image"); }
});

/* ---------- 3a: note <-> checklist ---------- */
async function convertCur(to){
  recordHistory();
  if (to === 'list'){
    cur.items = (cur.body || '').split('\n').map(l => l.trim()).filter(Boolean)
      .map(l => { const m = l.match(/^[-*•]\s*(\[( |x|X)\]\s*)?(.*)$/); return { id: uuid(), text: m ? m[3] : l, done: !!(m && m[2] && m[2] !== ' ') }; });
    cur.body = '';
  } else {
    cur.body = (cur.items || []).map(i => (i.done ? '- [x] ' : '- [ ] ') + i.text).join('\n');
    cur.items = [];
  }
  cur.type = to; curDirty = true; await commit();
  const keep = cur; await openEditor(keep);
  toast(to === 'list' ? 'Now a checklist' : 'Now a note');
}
function saveAsFile(){
  const text = noteAsText(cur);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
  a.download = (cur.title || 'note').replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 60) + '.txt';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- 3a: reminders ----------
   A web app can only alert you while it's open (or the next time you open it) - there's no way for a
   page to wake the phone at a set time. So a reminder also offers a Google Calendar entry, which will. */
function openReminder(){
  const pad = d => String(d).padStart(2, '0');
  const local = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const at = (days, h) => { const d = new Date(); d.setDate(d.getDate() + days); d.setHours(h, 0, 0, 0); return d.getTime(); };
  const later = at(0, 18) > now() + 30 * 60000 ? at(0, 18) : now() + 3600000;
  genSheet('Reminder', `
    <div class="remrow">
      <button data-at="${later}">${at(0, 18) > now() + 30 * 60000 ? 'This evening (6 pm)' : 'In an hour'}</button>
      <button data-at="${at(1, 9)}">Tomorrow 9 am</button>
      <button data-at="${at(7, 9)}">Next week</button>
    </div>
    <input type="datetime-local" class="reminput" id="remAt" value="${cur.remindAt ? local(cur.remindAt) : ''}">
    <div class="rechint" style="margin:10px 0">The app can only remind you while it's open (or the next time you open it). For a phone alarm, add it to Google Calendar too.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button id="remSave" class="txtbtn on">Save</button>
      <button id="remCal" class="txtbtn">Add to Google Calendar</button>
      ${cur.remindAt ? '<button id="remClear" class="txtbtn">Remove</button>' : ''}
    </div>`, body => {
      body.querySelectorAll('[data-at]').forEach(b => b.onclick = () => { $('#remAt').value = local(+b.dataset.at); });
      const val = () => { const v = $('#remAt').value; return v ? new Date(v).getTime() : 0; };
      $('#remSave').onclick = async () => {
        const t = val(); if (!t){ toast('Pick a time first'); return; }
        cur.remindAt = t; cur.remindFired = false; cur.remindDone = false; scheduleSave(); closeGen();
        toast('Reminder ' + fmtWhen(t));
        try { if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); } catch(e){}
      };
      $('#remCal').onclick = () => {
        const t = val() || cur.remindAt; if (!t){ toast('Pick a time first'); return; }
        const z = ts => new Date(ts).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
        const u = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(cur.title || noteAsText(cur).slice(0, 60) || 'DSR Notes reminder') +
                  '&dates=' + z(t) + '/' + z(t + 15 * 60000) + '&details=' + encodeURIComponent(noteAsText(cur).slice(0, 1500));
        window.open(u, '_blank', 'noopener');
      };
      const rc = $('#remClear'); if (rc) rc.onclick = () => { cur.remindAt = 0; cur.remindFired = false; scheduleSave(); closeGen(); toast('Reminder removed'); };
    });
}
async function checkReminders(){
  if (document.hidden) return;
  const due = NOTES.filter(n => n && n.remindAt && !n.remindFired && !n.deleted && n.remindAt <= now());
  for (const n of due){
    n.remindFired = true; await DB.put('notes', n);
    const title = n.title || noteAsText(n).split('\n')[0].slice(0, 60) || 'Reminder';
    try {
      if ('Notification' in window && Notification.permission === 'granted'){
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg) reg.showNotification('⏰ ' + title, { body: noteAsText(n).slice(0, 120), icon: 'icon.svg', tag: n.id });
        else new Notification('⏰ ' + title);
      }
    } catch(e){}
    toast('⏰ ' + title, 'Open', () => openEditor(n));
  }
  if (due.length) renderBoard();
}
setInterval(checkReminders, 30000);

async function deleteCurWithUndo(){
  await flushPendingDelete();
  const n = cur;
  clearTimeout(saveTimer); curDirty = false;
  n._deleted = true;
  if (NOTES.indexOf(n) < 0) NOTES.push(n);   // brand-new note never committed yet
  cur = null; editor.hidden = true; editor.classList.remove('tint'); renderBoard();
  const t = setTimeout(() => { pendingDel = null; deleteNote(n); }, 6000);
  pendingDel = { n, t };
  toast('Moved to Trash', 'Undo', () => {
    clearTimeout(t); pendingDel = null;
    delete n._deleted;
    DB.put('notes', n);
    renderBoard();
  });
}

/* ---------- labels sheet ---------- */
function openLabelSheet(){
  cur.labels = cur.labels || [];
  const known = new Set();
  NOTES.forEach(n => (n.labels || []).forEach(l => known.add(l)));
  cur.labels.forEach(l => known.add(l));
  const row = $('#lblRow');
  const draw = () => {
    const all = [...known].sort((a, b) => a.localeCompare(b));
    row.innerHTML = all.length
      ? all.map(l => `<label><input type="checkbox" ${cur.labels.includes(l) ? 'checked' : ''} data-l="${esc(l)}"><span># ${esc(l)}</span></label>`).join('')
      : `<div style="color:var(--dim);padding:10px 4px">No labels yet — create one below</div>`;
    row.querySelectorAll('input').forEach(cb => cb.onchange = () => {
      const l = cb.dataset.l;
      if (cb.checked){ if (!cur.labels.includes(l)) cur.labels.push(l); }
      else cur.labels = cur.labels.filter(x => x !== l);
      scheduleSave();
    });
  };
  draw();
  const nw = $('#lblNew'); nw.value = '';
  const add = () => {
    const v = nw.value.trim(); if (!v) return;
    known.add(v);
    if (!cur.labels.includes(v)) cur.labels.push(v);
    nw.value = ''; draw(); scheduleSave();
  };
  $('#lblAdd').onclick = add;
  nw.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); add(); } };
  $('#labelSheet').hidden = false;
}

async function duplicateCur(){
  await commit();
  const copy = JSON.parse(JSON.stringify(cur));
  copy.id = uuid(); copy.created = copy.updated = now(); copy.title = (copy.title||'Note') + ' (copy)';
  copy.pinned = false;
  for (const k of ['audioId','imageId']){
    if (copy[k]){ const rec = await DB.get('blobs', copy[k]); if (rec){ const nk = uuid(); await DB.put('blobs',{key:nk,blob:rec.blob}); copy[k]=nk; } }
  }
  copy.images = [];                                          // 3a: photos are copied too
  for (const k of (cur.images || [])){ const rec = await DB.get('blobs', k); if (rec){ const nk = uuid(); await DB.put('blobs', { key:nk, blob:rec.blob }); copy.images.push(nk); } }
  delete copy.history; delete copy._snap;
  await DB.put('notes', copy); NOTES.push(copy);
  toast('Duplicated');
}
function noteAsText(n){
  let s = (n.title ? n.title + '\n\n' : '');
  if (n.type === 'list') s += (n.items||[]).map(i => (i.done?'[x] ':'[ ] ') + i.text).join('\n');
  else s += (n.body || n.transcript || '');
  return s.trim();
}
async function shareCur(){
  await commit();
  const text = noteAsText(cur);
  if (navigator.share){ try{ await navigator.share({ title: cur.title || 'Note', text }); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(text); toast('Copied to clipboard'); }catch(e){ toast('Nothing to share'); }
}

/* ---------- colour sheet ---------- */
function openColorSheet(onPick){
  const row = $('#colorRow');
  row.innerHTML = COLORS.map(c =>
    `<button data-c="${c}" title="${COLOR_NAME[c]||c}" class="${!onPick && cur.color===c?'sel':''}" style="background:${COLOR_HEX[c]}"></button>`).join('');
  row.querySelectorAll('button').forEach(b => b.onclick = () => {
    $('#colorSheet').hidden = true;
    if (onPick){ onPick(b.dataset.c); return; }        // 3a: several notes at once
    cur.color = b.dataset.c; scheduleSave();
    applyEditorTint();
  });
  $('#colorSheet').hidden = false;
}

/* ---------- generic menu sheet ---------- */
function openMenuSheet(items){
  const list = $('#menuList');
  list.innerHTML = '';
  items.forEach(it => {
    const b = document.createElement('button');
    if (it.cls) b.className = it.cls;
    b.innerHTML = `<span>${it.icon}</span><span>${it.label}</span>`;
    b.onclick = () => { $('#menuSheet').hidden = true; it.fn(); };
    list.appendChild(b);
  });
  $('#menuSheet').hidden = false;
}

$('#moreBtn').onclick = () => openMenuSheet([
  ...(SYNC.cfg.url ? [{ label:'Sync now', icon:'☁', fn: () => syncNow() }] : []),
  { label:`Board grid (${gridCfg().free ? 'free' : gridCfg().x + ' × ' + gridCfg().y})…`, icon:'▦', fn: openGridSheet },
