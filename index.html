  { label: view==='archive' ? 'Show notes' : 'Show archive', icon:'🗄', fn: () => $('#archiveBtn').click() },
  { label: view==='trash' ? 'Leave the Trash' : `Trash (${NOTES.filter(inTrash).length})`, icon:'🗑', fn: () => setView(view === 'trash' ? 'board' : 'trash') },
  { label:'Sort: ' + ({ edited:'last edited', created:'date created', title:'title A–Z' }[sortMode] || 'last edited') + ' (tap to change)', icon:'⇅', fn: () => {
      sortMode = { edited:'created', created:'title', title:'edited' }[sortMode] || 'edited';
      localStorage.setItem('dsr-notes-sort', sortMode); renderBoard();
      toast('Sorted by ' + { edited:'last edited', created:'date created', title:'title' }[sortMode]);
    } },
  ...(view === 'trash' ? [{ label:'Empty the Trash', icon:'✕', cls:'del', fn: async () => {
      const t = NOTES.filter(inTrash);
      if (!t.length || !confirm(`Delete ${t.length} note${t.length === 1 ? '' : 's'} for good?`)) return;
      for (const n of t) await purgeNote(n); renderBoard(); toast('Trash emptied');
    } }] : []),
  { label:'About DSR Notes', icon:'ⓘ', fn: () => toast('DSR Notes 3b — local-first, optional sync') },
]);
function setView(v){
  view = v; selected.clear();
  localStorage.setItem('dsr-notes-view', view === 'trash' ? 'board' : view);
  archiveBtnLabel(); renderBoard();
  toast(v === 'trash' ? 'Trash' : v === 'archive' ? 'Archive' : 'Notes');
}

/* ---------- export / import ---------- */
async function exportAll(){
  const notes = (await DB.all('notes')).filter(n => !n.deleted);
  const blobKeys = new Set();
  notes.forEach(n => noteBlobKeys(n).forEach(k => blobKeys.add(k)));   // 3a: photos too
  const blobs = {};
  for (const k of blobKeys){
    const rec = await DB.get('blobs', k);
    if (rec) blobs[k] = { type: rec.blob.type, data: await blobToDataURL(rec.blob) };
  }
  const payload = { app:'dsr-notes', version:1, exportedAt:new Date().toISOString(), notes, blobs };
  const blob = new Blob([JSON.stringify(payload)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `dsr-notes-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Exported ${notes.length} notes`);
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== 'dsr-notes') throw 0;
    for (const [k, v] of Object.entries(data.blobs || {}))
      await DB.put('blobs', { key: k, blob: await dataURLToBlob(v.data) });
    for (const n of data.notes || []) await DB.put('notes', n);
    await loadNotes();
    renderBoard();
    toast(`Imported ${(data.notes||[]).length} notes`);
  } catch(err){ toast('Not a DSR Notes backup'); }
});

/* ============================================================
   SYNC  (optional — Cloudflare Worker + KV, see /worker)
   ============================================================ */
const SYNC_DEFAULT_URL = 'https://dsr-notes-sync.100dsr100.workers.dev';
const SYNC = {
  get cfg(){ try { return JSON.parse(localStorage.getItem('dsr-notes-sync') || '{}'); } catch(e){ return {}; } },
  set cfg(v){ localStorage.setItem('dsr-notes-sync', JSON.stringify(v)); },
  get last(){ return +localStorage.getItem('dsr-notes-synced') || 0; },
  set last(v){ localStorage.setItem('dsr-notes-synced', String(v)); },
  busy: false, autoT: null,
};

async function sapi(path, opt = {}){
  const { url, token } = SYNC.cfg;
  const r = await fetch(url.replace(/\/+$/, '') + path, {
    ...opt, headers: { Authorization: 'Bearer ' + token, ...(opt.headers || {}) },
  });
  if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
  return r;
}

function maybeAutoSync(){
  if (!SYNC.cfg.auto || !SYNC.cfg.url || !SYNC.cfg.token) return;
  clearTimeout(SYNC.autoT);
  SYNC.autoT = setTimeout(() => syncNow(true), 4000);
}

async function syncNow(quiet){
  const { url, token } = SYNC.cfg;
  if (!url || !token){ if (!quiet) toast('Set up sync in Settings first'); return; }
  if (SYNC.busy) return;
  SYNC.busy = true;
  const started = now();
  let pulled = 0, pushed = 0;
  try {
    await commit();                                   // flush the open editor first
    const idx = (await (await sapi('/notes')).json()).notes || [];
    const localById = new Map(NOTES.map(n => [n.id, n]));
    const serverById = new Map(idx.map(s => [s.id, s]));

    /* ---- pull: server has something newer (or we lack it) ---- */
    for (const s of idx){
      const l = localById.get(s.id);
      if (l && (l.updated || 0) >= s.updated) continue;
      const full = await (await sapi('/note/' + s.id)).json();
      for (const k of noteBlobKeys(full)){                     // 3a: photos too
        if (k && !(await DB.get('blobs', k))){
          try { await DB.put('blobs', { key: k, blob: await (await sapi('/blob/' + k)).blob() }); } catch(e){}
        }
      }
      // 3a: a deleted note keeps its blobs while it's in the Trash; only a purged one drops them
      if (full.purged){ const old = localById.get(full.id); if (old) for (const k of noteBlobKeys(old)) await DB.del('blobs', k); }
      await DB.put('notes', full);
      const i = NOTES.findIndex(n => n.id === full.id);
      if (i >= 0) NOTES[i] = full; else NOTES.push(full);
      pulled++;
    }

    /* ---- push: we have something the server lacks or is behind on ---- */
    for (const n of NOTES){
      const s = serverById.get(n.id);
      if (s && (s.updated || 0) >= (n.updated || 0)) continue;
      for (const k of noteBlobKeys(n)){                         // 3a: photos too
        const rec = await DB.get('blobs', k);
        if (rec) try { await sapi('/blob/' + k, { method:'PUT', body: rec.blob,
          headers: { 'Content-Type': rec.blob.type || 'application/octet-stream' } }); } catch(e){}
      }
      await sapi('/note/' + n.id, { method:'PUT',
        headers: { 'Content-Type':'application/json' }, body: JSON.stringify(n) });
      pushed++;
    }

    SYNC.last = started;
    if (pulled) { await loadNotes(); }
    renderBoard();
    updateSyncStatus();
    if (!quiet) toast(`Synced — ${pulled} in, ${pushed} out`);
  } catch(e){
    if (!quiet) toast('Sync failed: ' + e.message);
  } finally {
    SYNC.busy = false;
  }
}

function updateSyncStatus(){
  const el = $('#syncStatus'); if (!el) return;
  if (!SYNC.cfg.url){ el.textContent = 'Not configured'; return; }
  el.textContent = SYNC.last ? 'Last synced ' + new Date(SYNC.last).toLocaleString() : 'Configured — not synced yet';
}

function openSyncSheet(){
  const c = SYNC.cfg;
  $('#syncUrl').value = c.url || SYNC_DEFAULT_URL;   // 3b: your sync address (not a secret) filled in
  $('#syncToken').type = 'password'; $('#syncEye').textContent = '👁';
  $('#syncEye').onclick = () => {                      // 3b: see the token to copy it to another device
    const t = $('#syncToken'), show = t.type === 'password';
    t.type = show ? 'text' : 'password'; $('#syncEye').textContent = show ? '🙈' : '👁';
  };
  $('#syncToken').value = c.token || '';
  $('#syncAuto').checked = !!c.auto;
  updateSyncStatus();
  $('#syncSave').onclick = () => {
    SYNC.cfg = {
      url: $('#syncUrl').value.trim(),
      token: $('#syncToken').value.trim(),
      auto: $('#syncAuto').checked,
    };
    $('#syncSheet').hidden = true;
    toast('Sync settings saved');
  };
  $('#syncRun').onclick = () => {
    SYNC.cfg = { url: $('#syncUrl').value.trim(), token: $('#syncToken').value.trim(), auto: $('#syncAuto').checked };
    $('#syncSheet').hidden = true;
    syncNow();
  };
  $('#syncSheet').hidden = false;
}

window.addEventListener('online', () => maybeAutoSync());

/* 3a: switching apps / locking the phone saves straight away (2b waited 0.6 s, so the last edits could be lost) */
document.addEventListener('visibilitychange', async () => {
  if (document.hidden){
    if (cur && cur.type === 'draw' && cur._drawTouched) await saveDrawing();
    if (cur && curDirty){ clearTimeout(saveTimer); await commit(); }
  } else checkReminders();
});
window.addEventListener('pagehide', () => { if (cur && curDirty){ clearTimeout(saveTimer); commit(); } });

/* ============================================================
   BOOT
   ============================================================ */
(async function init(){
  await loadNotes();
  if (view === 'trash') view = 'board';
  archiveBtnLabel();
  renderBoard();
  if ('serviceWorker' in navigator)
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  if (SYNC.cfg.auto && SYNC.cfg.url && SYNC.cfg.token) syncNow(true);
  // 3a: home-screen shortcuts (?new=list ...) and "Share to DSR Notes" from other apps (?title=&text=&url=)
  const qs = new URLSearchParams(location.search);
  const nt = qs.get('new');
  if (qs.has('text') || qs.has('url') || qs.has('title')){
    await openEditor('text');
    cur.title = (qs.get('title') || '').slice(0, 200);
    cur.body = [qs.get('text'), qs.get('url')].filter(Boolean).join('\n');
    curDirty = true; await openEditor(cur);
    curDirty = true; scheduleSave();
  } else if (['text', 'list', 'voice', 'draw'].includes(nt)) openEditor(nt);
  if (location.search) history.replaceState(null, '', location.pathname);
  checkReminders();
})();

// back button / gesture closes the editor first
window.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    const openSheet = $$('.sheet').find(s => !s.hidden);
    if (openSheet) openSheet.hidden = true;
    else if (!$('#viewer').hidden) $('#viewer').hidden = true;
    else if (selected.size){ selected.clear(); renderBoard(); }
    else if (!editor.hidden) closeEditor();
  }
});
</script>
